        ?echo "this is the content of 1st file" > "file_no_1.txt" ; echo "stamp 1 for file A" >> file_A.txt ; av -y --silent -m "Added file_no_1.txt"
        ?echo "this is the content of 2nd file" > "file_no_2.txt" ; echo "stamp 2 for file A" >> file_A.txt ; av -y --silent -m "Added file_no_2.txt"
        ?echo "this is the content of 3th file" > "file_no_3.txt" ; echo "stamp 3 for file A" >> file_A.txt ; av -y --silent -m "Added file_no_3.txt"
        ?echo "this is the content of 4th file" > "file_no_4.txt" ; echo "stamp 4 for file A" >> file_A.txt ; av -y --silent -m "Added file_no_4.txt"
