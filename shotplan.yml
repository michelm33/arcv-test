      comment: |
        In this example, the hash of the head revision is displayed and compared with the one computed over a copy checked out in a separate folder. They should be the same.
        In detail:
          - A simple source folder 'test-arcv/test-project' containing 2 files file_A.txt and file_B.txt is put under version control. 
          - The hash is displayed. 
          - Then the head is checked out in /tmp
          - It is requested to display the hash computed over the checked out folder
          - Original and computed hash values shall be the same 

  checkhash:
    _categories: ["arcv-command-line", "manual"]
    _title: |
      Recompute and check hash signatures from checked out folders
    _usage: |
          arcv hash <directory>
    1:
      name: Example of showing how the hash signature can be recomputed and crosschecked with the original one established at commit
      pre-command: |
        ?source pretest.sh recreate
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        ?av -y --verbose -m "Commit project"
      command-display: |
        av hash /tmp/test-project
        av hash /tmp/test-project-rev1
      command : |         
        ?echo
        ?echo "Checking hash for a head revision checkout"
        ?av co -o /tmp
        ?Test__assertTwoCommandsSameOutput "av hash" "av hash /tmp/test-project"
        ?Test__assertCleanupDir /tmp/test-project     

        mkdir pack && echo fileC > pack/fileC
        ?sleep 2
        mkdir mydir && echo fileD > mydir/fileD
        ?av -yy --silent  # REVISION 1
        ?av co 1 -o /tmp
        ?av hash > /tmp/hasrev1
        ?Test__assertTwoCommandsSameOutput "av hash" "av hash /tmp/test-project-rev1"
        ?Test__assertCleanupDir /tmp/test-project-rev1
        
        echo extraline >> pack/fileC 
        echo fileF >> pack/fileF    # Creating a new file forced the time info of folder to be updated to a more recent one than before
        mkdir mydir2  # empty folder
        sleep 2
        mkdir mydir3 && echo fileE > mydir3/fileE        
        ?av -yy --silent  # REVISION 2
        ?av co 2 -o /tmp
        ?Test__assertTwoCommandsSameOutput "av hash" "av hash /tmp/test-project-rev2"
        ?Test__assertCleanupDir /tmp/test-project-rev2
        
        ?av co -o /tmp
        ?Test__assertTwoCommandsSameOutput "av hash" "av hash /tmp/test-project"
        ?Test__assertCleanupDir /tmp/test-project     

        ?av co 1 -o /tmp
        ?Test__assertTwoCommandsSameOutput "cat /tmp/hasrev1" "av hash /tmp/test-project-rev1"
        ?Test__assertCleanupDir /tmp/test-project-rev1

      post-command-display:
      post-command: |
        ?cleanupTestSourceDir
      comment: |
        In this example, there are multiple revisions for which a checkout is done and the hash is recomputed and checked for correctness against those known in the repository for each of them.

  listsources:
    _categories: ["arcv-command-line", "manual"]
    _title: |
      List the source folders stored in the repository
    _usage: |
        arcv list
    1:
      name: Example of listing of the source folders stored in the repository
      pre-command: |
        ?source pretest.sh recreate
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        ?av -y --verbose -m "Commit test-project"
        ?recreateTestSourceDirWithSpaces
        ?Test__assertChangeDir "$HOME/test-arcv/test project of mine"
        ?av -y --verbose -m "Commit test project of mine"
      command : | 
        av list
      post-command-display:
      post-command: |
        ?cleanupTestSourceDir
        ?cleanupTestSourceDirWithSpaces
      comment: |
        Two test folders are put under revision control and then the matching entries in the repository are listed.

  repoinfo:
    _categories: ["arcv-command-line", "manual"]
    _title: |
      Display all available internal repository information 
    _usage: |
        arcv repo
    1:
      name: Example of display of all available internal repository information 
      pre-command: |
        ?source pretest.sh recreate
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        ?Test__assertCmdNotExit 0 "av repo"
        ?av --silent -y -m "Commit project"
      command-display : | 
        av repo
      command : | 
        av repo
      post-command-display:
      post-command: |
      comment: |
        The folder 'test-project' is created. First, the repo info is requested, which should end up with an error.
        The folder is then put under revision control and immediately after repo info is requested again.
        At this stage, the information about release should be empty.
  
    2:
      name: Example of display of all repository information containing release information
      pre-command: |
        ?source pretest.sh
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"        
        ?sleep 1
        rm file_A.txt
        echo "Additional line for file B" >> file_B.txt
        ?av -y --silent -m "Removed file A and added line to file B"
        av -y pub MYTAG:1 -m "A version tagged with 'MYTAG'"
      command : |   
        av repo 
      post-command-display:
      post-command:
      comment: |
        In the continuation of the previous test, some modifications are applied and a release tag MYTAG is created. 
        The repo information is requested again.
        At this stage, the information about the latest release should be displayed (revision 1).

    3:
      name: Example of display of repository information which identifying name contains keyword 'release'
      pre-command: |
        ?source pretest.sh 
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        echo "Second additional line for file B" >> file_B.txt
        ?av -y --silent -m "Again added line to file B"
        ?av --silent -yy pub -m "auto release" || _exit -1 "Failed to create release tag"
        ?av -y --silent co VERSION.txt # We don't want to bother with this file here
      command : |   
        av repo release
      post-command-display:
      post-command:
      comment: |
        All information which identifying name contains the term "release" are displayed. 
        In the continuation of the previous test, some modifications are applied again and a release tag is created.
        Then, the information about the initial tag and the new release tag should be shown.
    4:
      name: Example of display of repository information which identifying name contains keyword 'dir'
      pre-command: |
        ?source pretest.sh 
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        av repo dir
      post-command-display:
      post-command: |
        ?cleanupTestSourceDir
      comment: |
        In the continuation of the previous test, all information which identifying name contains the term "dir" is displayed.

  checkup2date:
    _categories: ["arcv-command-line", "manual"]
    _title: |
      Check for modifications in a source folder under revision control
    _usage: |
        arcv check [ --verbose ]
    1:
      name: Example of checking for modification in a source folder under revision control
      pre-command: |
        ?source pretest.sh recreate
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        arcv check || echo "OK, properly detected folder not under rev control"
        av --silent -y ||  "Error: first commit failed"
      command-display : | 
        arcv check
        arcv check --verbose
      command : | 
        arcv check --verbose || _exit -1 "Error: change detected and shouldn't have" 
        ?Test__assertCmd "arcv check --verbose " "Image is up-to-date. Revision is 0"
        echo "extended file a content" >> "file_A.txt"
        arcv check --verbose && _exit -1 "Error: No change detected whereas file_A.txt changed." || echo "OK, a change was detected"
        arcv --silent -y co file_A.txt
        echo "This is my file C data" >> "file_C.txt"
        arcv check --verbose && _exit -1 "Error: No change detected whereas file_C.txt added." || echo "OK, file C addition detected!"
        rm "file_C.txt" "file_A.txt"
        arcv check --verbose && _exit -1 "Error: No change detected whereas file_A.txt removed." || echo "OK, file A removal detected!"
        arcv --silent -y co file_A.txt
        arcv check --verbose || _exit -1 "Error: change detected and shouldn't have" 
      post-command-display:
      post-command: |
        ?cleanupTestSourceDir
      comment: |
        Change detection is tested in various scenarios: folder not under revision control, no change, modified file, added file, removed file.
        In detail:
        - A new source folder holding 2 files is created.
        - Requesting status shows a message warning the user the folder is not under revision control.
        - The folder is then put under version control. 
        - Requesting status returns 0 with a message informing everything is up-to-date.
        - Then file A is changed and requesting status returns 1 meaning a change was detected compared with the head revision.
        - file A is restored and a file C is added. requesting status returns 1
        - file A is removed. Rquesting status returns 1
        - file A is restored. Rquesting status returns 0


  modifyfileperms:
    _categories: ["arcv-command-line", "manual"]
    _title: |
      Check-in and check-out a file which permissions change
    _usage: |
        arcv
    1:
      name: Example of check-in of file which permissions changed
      pre-command: |
        umask 002
        ?source pretest.sh recreate
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        ?av --silent -y   # init rev 0
        chmod 700 "file_A.txt"
        Test__assertCmd "ls -l file_A.txt | awk '{print \$1}'" "-rwx------"
        arcv check --verbose && _exit -1 "Error: no change detected and should have" || echo "OK change detected"
      command-display : | 
        arcv
      command : | 
        arcv -y -m "Update file_A.txt with no access rights for others"
      post-command-display:
      post-command: |
        chmod 777 "file_A.txt"
        Test__assertCmd "ls -l file_A.txt | awk '{print \$1}'" "-rwxrwxrwx"
        arcv check --verbose && _exit -1 "Error: no change detected and should have" || echo "OK change detected"
        av -y co file_A.txt 
        Test__assertCmd "ls -l file_A.txt | awk '{print \$1}'" "-rwx------"
        ?cleanupTestSourceDir
      comment: |
        The access rights are removed for file_A.txt, ensuring there were some before by using umask 002. 
        It is checked the change is detected and can be committed in a new revision.
        Afterwards, the permissions are changed and the last committed ones are restored.
        It is checked that the restore file permissions are matching those committed at first place.

  modifydirperms:
    _categories: ["arcv-command-line", "manual"]
    _title: |
      Check-in and check-out a directory which permissions change
    _usage: |
        arcv
    1:
      name: Example of check-in of directory which permissions changed
      pre-command: |
        umask 002
        ?source pretest.sh recreate
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        mkdir subdir 
        echo "message" > subdir/testfile.txt
        ?av --silent -y   # init rev 0
        chmod 700 "subdir"
        ?Test__assertCmd "ls -l -d subdir | awk '{print \$1}'" "drwx------"
        ?arcv check --verbose && _exit -1 "Error: no change detected and should have" || echo "av check: OK change detected"
      command-display : | 
        arcv
      command : | 
        arcv -y -m "Update subdir with no access rights for others"
      post-command-display:
      post-command: |
        chmod 777 "subdir"
        ?Test__assertCmd "ls -l -d subdir | awk '{print \$1}'" "drwxrwxrwx"
        arcv check --verbose && _exit -1 "Error: no change detected and should have" || echo "OK change detected"
        av -y co subdir 
        ?Test__assertCmd "ls -l -d subdir | awk '{print \$1}'" "drwx------"
        ?cleanupTestSourceDir
      comment: |
        The access rights are removed for subdir, ensuring there were some before by using umask 002. 
        It is checked the change is detected and can be committed in a new revision.
        Afterwards, the permissions are changed and the last committed ones are restored.
        It is checked that the restore file permissions are matching those committed at first place.

  remove_dir_after_modify_other_dir_perms:
    _categories: ["arcv-command-line", "manual"]
    _title: |
        Check-in a directory which permissions change and then check-in removal of another folder
    _usage: |
        arcv
    1:
      name: Check-in of directory which permissions changed and then check-in removal of another folder
      pre-command: |
        umask 002
        ?source pretest.sh recreate
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        mkdir subdir1
        mkdir subdir2
        mkdir subdir3
        mkdir subdir4
        ?av --silent -y   # init rev 0
        chmod 700 "subdir2"
        ?Test__assertCmd "ls -l -d subdir2 | awk '{print \$1}'" "drwx------"
        ?arcv check --verbose && _exit -1 "Error: no change detected and should have" || echo "av check: OK change detected"
        ?arcv --silent -y -m "Update subdir2's access rights"
        rmdir subdir1
      command-display : | 
        av check --verbose
      command : | 
        ??av check --verbose 
        ?echo "Now checking output, only deleted file should be reported"
        ??av check --verbose > "/tmp/checkinstatus.txt"
        ?Test__assertFileLastLine "/tmp/checkinstatus.txt" 'There are deleted files for revision 1'
        ?#It should not return "There are deleted, changed permissions for files for revision 1" as last line
      post-command-display:
      post-command: |
        chmod 777 "subdir2"
        ?Test__assertCmd "ls -l -d subdir2 | awk '{print \$1}'" "drwxrwxrwx"
        av -y co subdir2
        ?Test__assertCmd "ls -l -d subdir2 | awk '{print \$1}'" "drwx------"
        ?cleanupTestSourceDir
      comment: |
        The purpose of the test is to check permission-only change are properly detected after committing 
        a such a change on one folder and try to commit the removal of another one afterwards.
        This test is useful, because the check of permission check is always performed on all folders like 
        they are given as reference by the head. If one disappears, this may corrupt internal algorithm used
        which always expected the same list of folders both in the head revision and in the current directory.

  listmodifiedfiles:
    _categories: ["arcv-command-line", "manual"]
    _title: |
      List any file change in a source folder (new/deleted/modified/permissions)
    _usage: |
      arcv -l
    1:
      name: Example of listing changes in a source folder
      pre-command: |
        umask 002
        ?source pretest.sh recreate
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        
        echo "file C" >> file_C.txt
        ?av --silent -y -m "Adding file A,B,C"   # init rev 0

        chmod 700 "file_A.txt"
        rm file_B.txt
        echo "Second line file file C" >> file_C.txt
        echo "file D" >> file_D.txt
        ?arcv check --verbose && _exit -1 "Error: no change detected and should have" || echo "OK change detected"
        Test__assertCmd "ls -l file_A.txt | awk '{print \$1}'" "-rwx------"
      command-display : | 
        av -l
      command : | 
        av -l
        ?Test__assertCmdOutput "${ARCV_TEST_DIR}/ref-output/listmodifiedfiles-1.txt" "av -l" true 4 15
      post-command-display:
      post-command: |
        ?cleanupTestSourceDir
      comment: |
        All types of detected changes are probed using -l option: added/removed/changed file, permission-only change.
        
        In detail:

        - A folder with file_A.txt, file_B.txt, file_C.txt are put under revision control.
        - Then the following changes are applied: Changed perms for file A, removed file B, modified file C, added file D
        - The changes are listed using -l option and it is checked every change is listed as expected.

  compare:
    _categories: ["arcv-command-line", "manual"]
    _title: |
      Comparing revisions 
    _usage: |
          arcv diff [ <revision> | head | current[vs<revision | release tag>] ]
          arcv meld [ <revision> | head | current[vs<revision | release tag>] ]
          arcv git [ <revision> | head | current[vs<revision | release tag>] ]
    1:
      name: Sample scenarios of comparing revisions using simple diff tool
      pre-command: |
          ?source pretest.sh recreate
          ?Test__assertChangeDir "$HOME/test-arcv/test-project"
          ?av --silent -y   # init
          ?av --silent -yy pub -m "auto release 1.0.0" || _exit -1 "Failed to create release tag"
          ?av -y --silent co VERSION.txt # We don't want to bother with this file here

      command-display : |
          av diff               # diff between working dir and head revision
          av diff 2             # diff between working dir and revision 2
          av diff R1.0.0        # diff between working dir and tag R1.0.0
          av diff headvs2       # diff between head and revision 2
          av diff 2vs0          # diff between revision 2 and revision 0
          av diff 1vs0          # diff between revision 1 and revision 0
          av diff 3vsR1.0.0     # diff between revision 3 and tag R1.0.0

      command : | 
          echo "This is the second line of file A" >> "file_A.txt"
          ?av -y --silent -m "Added 2nd line" # revision 2
          ?sleep 1 # This is needed for the container tests
          echo "This is the third line of file A" >> "file_A.txt"
          ?av -y --silent -m "Added 3rd line" # revision 3          
          ?sleep 1

          echo "This is the fourth line of file A (not committed)" >> "file_A.txt" # Not committed

          ??av diff --fmt=plain > diffresult.txt  # diff current vs head
          ?Test__assertFileLastLine "diffresult.txt" '> This is the fourth line of file A (not committed)'

          ??av diff 2 --fmt=plain > diffresult.txt  # diff current vs revision 2 preceeding head
          ?Test__assertFileLine "diffresult.txt" 5 '> This is the third line of file A'
          ?Test__assertFileLine "diffresult.txt" 6 '> This is the fourth line of file A (not committed)'          

          ??av diff R1.0.0 --fmt=plain > diffresult.txt # diff current vs release tag R1.0.0
          ?Test__assertFileLine "diffresult.txt" 4 '> This is the second line of file A'
          ?Test__assertFileLine "diffresult.txt" 5 '> This is the third line of file A'
          ?Test__assertFileLine "diffresult.txt" 6 '> This is the fourth line of file A (not committed)'          

          ??av diff headvs2 --fmt=plain > diffresult.txt # diff head and revision 2
          ?Test__assertFileLastLine "diffresult.txt" '< This is the third line of file A'

          ??av diff 2vs0 --fmt=plain > diffresult.txt # diff rev 1 and 0
          ?Test__assertFileLastLine "diffresult.txt" '< This is the second line of file A'

          ??av diff 1vs0 --fmt=plain | grep 'Only in' | grep 'VERSION.txt' > diffresult.txt 
          ?Test__assertFileContentPattern diffresult.txt '^Only in.+VERSION\.txt'

          ??av diff 3vsR1.0.0 --fmt=plain  > diffresult.txt # diff rev 3 and tag 1.0.0
          ?Test__assertFileLine "diffresult.txt" 3 '< This is the second line of file A'
          ?Test__assertFileLine "diffresult.txt" 4 '< This is the third line of file A'
      post-command-display:
      post-command: |
         ?cleanupTestSourceDir
      comment: |
        In this test, various diff scenarios are exercised. Between workdir and resp. head, random revision and a release tag. Between a revision and random other revisions, between head and a random revision. 
        In detail:
        - A new source folder test-arcv/test-project is created with 2 files file_A.txt and file_B.txt is put under version control
        - revision 0: file_A.txt has a one line
        - revision 1: release tag added (TAG R.1.0.0)
        - revision 2: 2nd line is added to file_A.txt
        - revision 3: 3rd line is added to file_A.txt (HEAD)
        - (working dir):  4th line is added to file_A.txt
        The following diffs are carried out between:
        - working dir and head revision, showing the extra 4th line.
        - working dir and revision 2, showing the extra 3rd and 4th lines.
        - working dir and tag R1.0.0, showing the extra 2nd, 3rd and 4th lines.
        - head and revision 2, showing the extra 3rd line.
        - revision 2 and revision 0, showing the extra 2nd line.
        - revision 1 and revision 0, showing that VERSION.txt is only in rev
        - revision 3 and tag R1.0.0, showing the extra 2nd line and 3rd line.

  compareatcheckin:
    _categories: ["arcv-command-line-with-graphics", "manual"]
    _title: |
      Checking changes at check-in
    _usage: |
        arcv
    1:
      name: Example of checking changes at check-in
      live-recording: yes
      screen-keyboard: yes
      pre-command: |
      command-display: |
        arcv
      command : |
        ?source pretest.sh recreate
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        av -y --silent
        echo "This is the second line of file A" >> "file_A.txt"
        echo "No reason why B wouldn't get his 2nd line as well" >> "file_B.txt"
        gnome-terminal --geometry 150x30+0+0 --title="test-project" --wait --command="/bin/bash -c 'reset && av && sleep 5'"
        ?cleanupTestSourceDir
      comment: |
        This video shows how changes of modified files can be visualized with meld tool at check-in.
        In detail:
          - A new source folder test-arcv/test-project with 2 files file_A.txt and file_B.txt is put under version control. 
          - A 2nd line is added both for files A and B is committed.
          - In the terminal menu showing the changed files, file_A.txt is selected and <ENTER> is pressed to review the changes with meld.
          - The same is done for file_B.txt.          

  reltag:
    _categories: ["arcv-command-line", "manual"]
    _title: |
      Creating a release tag for a head revision ('publish')
    _usage: |
        arcv pub [ -m <log message> ]
    1:
      name: Example of release tag creation for head revision
      pre-command: |
        ?source pretest.sh recreate
        ?[ -d "/tmp/test-project-R1.0.0" ] && rm -r "/tmp/test-project-R1.0.0" || true
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        ?av --silent -y 
      command-display : | 
        av -y pub -m "A test release 1.0.0"
      command : | 
        av -yy pub -m "A test release 1.0.0" || _exit -1 "Failed to create release tag"
      post-command-display:
      post-command: |
        ?arcv check --verbose && _exit -1 "Error: No change detected whereas VERSION.txt should have been updated following release tagging"  || echo "OK change detected"

        ?Test__assertFileContent "$HOME/test-arcv/test-project/VERSION.txt" "1.0.1"
        ?Test__assertSymlinkPath  "${REPODIR}/test-project.archive/releases/R1.0.0" "../test-project.archive1"
        ?Test__assertFileContent "${REPODIR}/test-project.archive/releases/R1.0.0.log" "A test release 1.0.0"

        ?echo 
        ?echo "Committing changes after tagging"
        rm file_A.txt
        echo "Additional line for file B" >> file_B.txt
        ?av -y --silent -m "Changed file A and B state before checking out release"
        av log

        ?echo 
        ?echo "Now checking out release tagged 1.0.0 and check if original file A and B OK"
        av co R1.0.0 -o /tmp
        ?Test__assertChangeDir "/tmp/test-project-R1.0.0"
        ?Test__assertFileContent "VERSION.txt" "1.0.0"
        ?Test__assertFileContent "file_A.txt" "Test file A"
        ?Test__assertFileContent "file_B.txt" "Test file B"
        ?rm -r "/tmp/test-project-R1.0.0" &>/dev/null || true
        ?cleanupTestSourceDir
      comment: |
        In this test, first revision is tagged, the new VERSION.txt and the repo revision data are inspected. After applying some changes on the current source, the release revision is checked out to verify that the file status corresponds to the initial check-in.

        In detail:
          - A new source folder holding 2 files is created and put under rev control.
          - Then a release tag is created, selecting 1.0.1 as version follower beyond this release. 
          - After tag creation, a change is detected in source folder, since VERSION.txt should have been updated with value 1.0.1.
          - Note that release will be bound to revision 2 and not 1, because an automatic commit of the auto-created VERSION.txt is carried out, due to the 'y' option.
          - Then, file A is removed and file B is changed.
          - Release 1.0.0 is checked out and all files content are checked for consistency. Last applied changes should not be part of it.
    2:
      name: Example of tag creation to a random revision
      pre-command: |
        ?source pretest.sh recreate
        ?[ -d "/tmp/test-project-R1.0.0" ] && rm -r "/tmp/test-project-R1.0.0" || true
        ?[ -d "/tmp/test-project-MYTAG" ] && rm -r "/tmp/test-project-MYTAG" || true
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        ?av --silent -y 
        ?sleep 2
        ?echo 
        ?echo "Committing changes BEFORE tagging"
        rm file_A.txt
        echo "Additional line for file B" >> file_B.txt
        ?av -y --silent -m "Removed file A and added line to file B"
      command-display : | 
        av -y pub MYTAG:1 -m "A version tagged with 'MYTAG'"
      command : | 
        av -yy pub MYTAG:1 -m "A version tagged with 'MYTAG'" || _exit -1 "Failed to create release tag"
      post-command-display:
      post-command: |
        ?arcv check --verbose || _exit -1 "OK: No other change detected"

        ?echo 
        ?echo "Now checking existing of tag symlink and tag log"
        ?Test__assertFilesShouldNotExist "$HOME/test-arcv/test-project/VERSION.txt" 
        ?Test__assertSymlinkPath  "${REPODIR}/test-project.archive/releases/MYTAG" "../test-project.archive1"
        ?Test__assertFileContent "${REPODIR}/test-project.archive/releases/MYTAG.log" "A version tagged with 'MYTAG'"
        
        ?echo "This is new file C" >> file_C.txt
        ?echo "Second additional line for file B" >> file_B.txt
        ?av -y --silent -m "Added line to file B again and added file C"
        ?av -yy --silent  pub -m "Release after second changes" || _exit -1 "Failed to create release tag"

        av rel
        ?Test__assertCmdOutput "${ARCV_TEST_DIR}/ref-output/reltag-2.txt" "av rel --fmt=plain" true

        ?echo "Now checking out MYTAG and check file B and A is not there."
        av co MYTAG -o /tmp
        ?Test__assertChangeDir "/tmp/test-project-MYTAG"
        ?Test__assertFilesShouldNotExist "file_A.txt"
        ?Test__assertFilesShouldNotExist "file_C.txt"
        ?Test__assertFileLastLine "file_B.txt" "Additional line for file B"

        ?echo "Now checking out release tagged 1.0.0 and check if original file A and B OK"
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        av co R1.0.0 -o /tmp
        ?Test__assertChangeDir "/tmp/test-project-R1.0.0"
        ?Test__assertFileContent "VERSION.txt" "1.0.0"
        ?Test__assertFilesShouldNotExist "file_A.txt"
        ?Test__assertFileContent "file_C.txt" "This is new file C"
        ?Test__assertFileLastLine "file_B.txt" "Second additional line for file B"

        ?[ -d "/tmp/test-project-R1.0.0" ] && rm -r "/tmp/test-project-R1.0.0" || true
        ?[ -d "/tmp/test-project-MYTAG" ] && rm -r "/tmp/test-project-MYTAG" || true
        ?cleanupTestSourceDir
      comment: |
        After applying some changes on the current source, the revision is tagged. The repo revision data are inspected. Then, the tagged revision is checked out to verify that the file status corresponds to the last applied changes.

        In detail:
          - A new source folder holding 2 files is created and put under rev control.
          - file A is removed and file B is changed.
          - Then a  tag 'MYTAG' is created 
          - After tag creation, no change is detected and no VERSION.txt should have been created
          - At this point file_C.txt is created and file B modified again.
          - A regular release tag is created
          - Tag 'MYTAG' is checked out and all files content are checked for consistency. First applied changes should be part of it and not second changes done after tagging.
          - Release tag is checked out and all files content are checked for consistency. Second applied changes should be part of it.


  hook:
    _categories: ["arcv-command-line", "manual"]
    _title: |
      Create a hook for executing a program after release tag creation 
    _usage: |
        arcv
    1:
      name: Example of creating a hook for executing a program after release tag creation
      pre-command: |
        ?source pretest.sh recreate
        ?[ -d "/tmp/test-project-R1.0.0" ] && rm -r "/tmp/test-project-R1.0.0" || true
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        ?echo "#!/bin/bash" > myhook.sh
        ?echo "av repo latest-release-tag > hook.proof" >> myhook.sh
        ?av --silent -y 
      command-display : | 
        av hook myhook.sh
      command : | 
        av hook myhook.sh
      post-command-display:
      post-command: |
        av -yy pub -m "A test release 1.0.0" || _exit -1 "Failed to create release tag"
        ?echo 
        ?echo "Now checking that file hook.proof was actually created by the hook script"        
        ?Test__assertFileContent "hook.proof" "R1.0.0"
        arcv hook
        ?Test__assertCmd "arcv hook --fmt=plain" "0 'myhook.sh'"
        ?cleanupTestSourceDir
      comment: |
        This simple test checks that a defined hook script is called after a release tag has been created.
        
        In detail:
        A test folder is put under revision control, including the 'hook.sh' script, which requests the latest release tag of current folder and saves the result in the file 'hook.proof'.
        Then, 'hook.sh' script is added as a release hook.
        The release tag is created.
        After that, it is checked that file 'hook.proof' was created and contains the string 'R.1.0.0'. Also, the list of currently defined hook(s) is checked and displayed. 

  branch:
    _categories: ["arcv-command-line", "manual"]
    _title: |
      Create branches
    _usage: |
          arcv branch <branch folder name>:[<revision | release tag>] [ -o <output folder> ]
    1:
      name: Example of branch creation from head revision, random revisions and release tag
      pre-command: |
        ?source pretest.sh recreate
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        ?av -yy --silent   # init
        ?av --silent -yy pub -m "auto release 1.0.0" || _exit -1 "Failed to create release tag"
        ?av -y --silent co VERSION.txt # We don't want to bother with this file here
        ?echo "This is the second line of file A" >> "file_A.txt"
        ?av -y --silent -m "Added 2nd line" # revision 2
        ?echo "This is the third line of file A" >> "file_A.txt"
        ?av -y --silent -m "Added 3rd line" # revision 3          
        ?echo "This is the fourth line of file A (not committed)" >> "file_A.txt"
      command-display : | 
        av branch fun-project
        av branch fun-project:2
        av branch fun-project:R1.0.0
        av branch fun-project:0 -o /tmp/
      command : | 
        #branch  BRANCH_FOLDER[:REVISION | RELEASE TAG] Branch off a revision
        ?cleanupFunProjectDirs
        av --silent -y branch fun-project
        ?diff -r . ../fun-project > /tmp/diffresult.txt && _exit -1 "Error: no diff detected" || true
        ?Test__assertFileLastLine "/tmp/diffresult.txt" '< This is the fourth line of file A (not committed)'

        ?cleanupFunProjectDirs
        av --silent -y branch fun-project:2
        ?diff -r . ../fun-project > /tmp/diffresult.txt && _exit -1 "Error: no diff detected" || true
        ?Test__assertFileLine "/tmp/diffresult.txt" 3 '< This is the third line of file A'
        ?Test__assertFileLine "/tmp/diffresult.txt" 4 '< This is the fourth line of file A (not committed)'          

        ?cleanupFunProjectDirs
        av --silent -y branch fun-project:R1.0.0
        ?diff -r . ../fun-project > /tmp/diffresult.txt && _exit -1 "Error: no diff detected" || true
        ?Test__assertFileLine "/tmp/diffresult.txt" 3 '< This is the second line of file A'
        ?Test__assertFileLine "/tmp/diffresult.txt" 4 '< This is the third line of file A'
        ?Test__assertFileLine "/tmp/diffresult.txt" 5 '< This is the fourth line of file A (not committed)'          

        ?cleanupFunProjectDirs
        av --silent -y branch fun-project:0 -o /tmp/
        av --silent -y co R1.0.0 -o /tmp/
        ?diff -r /tmp/test-project-R1.0.0 /tmp/fun-project > /tmp/diffresult.txt && _exit -1 "Error: no diff detected" || true
        [ "$(cat /tmp/diffresult.txt)" = "Only in /tmp/test-project-R1.0.0: VERSION.txt" ] && echo "OK diff is OK" || (sleep 1 && _exit -1 "Error: unexpected differences found!")

      post-command-display:      
      post-command: |
      comment: |
        This test exercises different branching scenarios: branching off a random revision, branching off a releae tag, branching off with an explicit output folder.
        In detail:
          - A new source folder test-arcv/test-project is created with 2 files file_A.txt and file_B.txt and put under version control
          - revision 0: file_A.txt has a one line
          - revision 1: release tag added (TAG R.1.0.0)
          - revision 2: 2nd line is added to file_A.txt
          - revision 3: 3rd line is added to file_A.txt (HEAD)
          - (working dir):  4th line is added to file_A.txt
          The following branches are created and resulting diff results:
          - off head revision: head revision shows the extra 4th line.
          - off revision 2: head revision shows the extra 3rd and 4th lines.
          - off release tag R1.0.0: head rev shows the extra 2nd, 3rd and 4th lines.
          - off revision 0: a different output dir is used. The branch is checked against a checkout of the release tag. The diff shall show that VERSION.txt is only present in the release checkout.

  tarball:
    _categories: ["arcv-command-line", "manual"]
    _title: |
      Exporting a revision as a tarball
    _usage: |
        arcv tarball [ <revision> | head ]
    1:
      name: Example of tarball export for head revision, modified head revision and random revision
      pre-command: |
        ?source pretest.sh recreate
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        ?av --silent -y
      command-display: | 
        av tarball -o /tmp      # Create tar for current source in /tmp
        av tarball head -o /tmp # Create tar for head revision in /tmp
        av tarball 0 -o $HOME # Create tar for very first revision in user's home
      command : | 
        av tarball -o /tmp
        ?Test__assertFilesShouldExist /tmp/test-project-0.tar.gz
        echo "Extra line for file A" >> "file_A.txt"
        av tarball -o /tmp
        sleep 2
        #_log_vars LANG LC_ALL TZ >&2
        ?Test__assertFilesShouldExist /tmp/test-project-0M-$(date +"%Y%m%d").tar.gz
        ?av -y --silent -m "Committing change of file A in revision 1"
        av tarball head -o /tmp
        sleep 2
        ?Test__assertFilesShouldExist /tmp/test-project-1.tar.gz
        av tarball 0 -o $HOME
        sleep 2
        ?Test__assertFilesShouldExist $HOME/test-project-0.tar.gz
      post-command-display:
      post-command: |
        echo "Extracting all tarballs before check"
        ?mkdir /tmp/test-project-0 &>/dev/null ; cd /tmp/test-project-0
        ?tar xvf /tmp/test-project-0.tar.gz >/dev/null
        ?mkdir /tmp/test-project-0M &>/dev/null ; cd  /tmp/test-project-0M  
        ?tar xvf /tmp/test-project-0M-$(date +"%Y%m%d").tar.gz >/dev/null
        ?mkdir /tmp/test-project-1 &>/dev/null ; cd /tmp/test-project-1
        ?tar xvf /tmp/test-project-1.tar.gz >/dev/null
        ?mkdir $HOME/test-project-0 &>/dev/null ; cd $HOME/test-project-0
        ?tar xvf $HOME/test-project-0.tar.gz >/dev/null
        sleep 3
        diff -r /tmp/test-project-0M /tmp/test-project-1 || _exit -1 "Extracts 0M and 1 should be the same"
        diff -r /tmp/test-project-0 /tmp/test-project-1 && _exit -1 "Extracts 0 and 1 should not be the same" || echo "OK, Extracts 0 and 1 are different" 
        ?cleanupTestSourceDir
      comment: |
        This test exercises different tarball creation scenarios: from a random revision, from head revision, using different output folders.
        In detail:
        - A new source folder holding 2 files file_A.txt and file_B.txt is created and put under rev control.
        - A tarball is generated for revision 0. It is checked test-project.0.tar.gz was created.
        - File A is modified and a tarball is generated for modified revision 0. It is checked test-project-0M.tar.gz was created.
        - File A change is committed and a tarball is generated for revision 1. It is checked test-project-1.tar.gz was created.
        - Finally, a tarball is created for explicit revision 0, in a different folder (HOME).
        - At the end, all tarballs are extracted and it is checked that:
          * test-project-0M.tar.gz and test-project-1.tar.gz contain the same files
          * test-project-0.tar.gz and test-project-1.tar.gz contain differences matching the above applied ones.
        - test-project-0.tar.gz and test-project-0.tar.gz of HOME contain the same files

  github:
    _filter: "[ -f /.dockerenv ]"
    _categories: ["arcv-command-line", "manual"]
    _title: |
      Exporting a revision to GitHub
    _usage: |
        arcv export [ <directory> ]
    1:
      name: Example of export to GitHub of head revision
      pre-command: |
        ?source pretest.sh recreate
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
        ?av -y --silent
        echo "Copyright (c) Frog Goodfrog" > COPYRIGHT.txt
        echo "1.1.0" > VERSION.txt
        echo "git@github.com:michelm33/test-project.git" > GITHUB.txt
        ?av -y --silent -m "adding files required to export"
        ?av log
      command-display : | 
        av export
      command : | 
        av -yy export
      post-command-display:
      post-command: |
      comment: |
        This test exposes how a source folder in its current state under revision control can be exported to GitHub.
        In detail:
          - A new source folder holding 2 files file_A.txt and file_B.txt is created and put under rev control.
          - The test source folder is completed with the following files: COPYRIGHT.txt, VERSION.txt, GITHUB.txt for the sake of preparing the export to GitHub.
          - On GitHub, create the 'test-project' repo on GitHub. 
          - On GitHub, add the SSH key for the local host from which the test is run.
          - On GitHub, if step 2 was already run in a previous test, ensure to remove file_C.txt out there.
          - The current source is then exported and it is checked GitHub was updated. 
    2:
      name: Example of export to GitHub of a random release directory
      pre-command: |
        ?source pretest.sh
        ?Test__assertChangeDir "$HOME/test-arcv"
        ?rm -r /tmp/test-project-release-1.1.1 &>/dev/null || true
        cp -r test-project /tmp/test-project-release-1.1.1
        echo "New file C" > /tmp/test-project-release-1.1.1/file_C.txt
        echo "1.1.1" > /tmp/test-project-release-1.1.1/VERSION.txt
        ?Test__assertChangeDir "$HOME/test-arcv/test-project"
      command : | 
        av -yy export /tmp/test-project-release-1.1.1
      post-command-display:
      post-command: |
        ?cleanupTestSourceDir
      comment: |
        In the continuation of previous step, this shows how an explicit, random folder can be exported from a source folder under revision control.
        In detail: 
        - A release folder is created with version 1.1.1 in a temporary folder,  as a copy of 'test-folder', to which file file_C.txt is added.
        - The fabricated release folder is exported 
        - It is checked that GitHub was updated:
            * VERSION.txt is set to 1.1.1 
            * file_C.txt is present.

